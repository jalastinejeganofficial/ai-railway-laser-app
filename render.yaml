services:
  - type: web
    name: ai-railway-qr-system
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SUPABASE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false