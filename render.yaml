services:
  - type: web
    name: railway-qr-scanner
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y libzbar0 libzbar-dev
      pip install --upgrade pip
      pip install -r requirements-full.txt || pip install -r requirements.txt
      python startup.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --preload app:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SUPABASE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false