<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replacement Report Generated</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7fc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      background: #fff;
      padding: 25px 35px;
      border-radius: 15px;
      box-shadow: 0px 6px 18px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 800px;
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .report-info {
      background: #e8f5e8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #4CAF50;
    }

    .report-content {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 14px;
      color: #2c3e50;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #4e73df;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }

    a:hover {
      background: #3751c5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>✅ Replacement Report Generated</h2>
    
    <div class="report-info">
      <p><strong>Lot Number:</strong> {{ lot }}</p>
      <p><strong>Generated:</strong> {{ moment().format('YYYY-MM-DD HH:mm:ss') if moment else 'Just now' }}</p>
    </div>
    
    <div class="report-content">
      {{ report | safe }}
    </div>

    <a href="{{ url_for('view_details', code=lot) }}">⬅️ Back to Details</a>
  </div>
</body>
</html>
